<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стеллаж за роялем: выбор вариантов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECE6DC;--card:#F5F0E8;--ink:#2A2825;--muted:#746C60;--accent:#8A6C43;--olive:#5E6040;--rust:#B5482C;--line:#D8CFC0;--ph:#CFC5B3;--yes:#5E6040;--maybe:#8A6C43;--no:#B5482C;--on:#F5F0E8}
@media (prefers-color-scheme:dark){:root{--bg:#1E1D1B;--card:#282825;--ink:#EDE7DB;--muted:#A89F90;--accent:#C2A272;--olive:#A3A67A;--rust:#D9795C;--line:#3A3835;--ph:#4A4741;--yes:#8E9163;--maybe:#B38F5A;--no:#C8674A;--on:#1E1D1B}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 0;border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600;line-height:1.1;margin:0}
.sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.who{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 13px "Instrument Sans",sans-serif;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;border:0;background:none;color:var(--muted);font:500 14px "Instrument Sans",sans-serif;padding:10px 4px 11px;border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.nav{display:flex;align-items:center;gap:10px;margin:12px 0 10px}
.nb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;flex:none}
.nb:disabled{opacity:.35;cursor:default}
.prog{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.photo{position:relative;aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo img.cover{object-fit:cover}
.photo .nop{font-size:13px;color:var(--muted);padding:20px;text-align:center}
.vb{position:absolute;left:10px;top:10px;padding:6px 12px;border-radius:999px;font:600 13px "Instrument Sans",sans-serif;color:var(--on)}
.vb.y{background:var(--yes)}.vb.m{background:var(--maybe)}.vb.n{background:var(--no)}
.in{padding:16px 16px 18px}
.maker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h2.name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:32px;line-height:1.05;margin:4px 0 10px}
.price{margin:2px 0 4px}
.price strong{font-family:"Cormorant Garamond",Georgia,serif;font-size:38px;font-weight:600;line-height:1;color:var(--ink)}
.price strong.none{font-size:24px;color:var(--muted)}
.price s{color:var(--muted);margin-left:10px;font-size:15px}
.price small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.setline{display:inline-block;margin:10px 0 0;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink);font-size:14px;font-weight:500}
.sch{margin:16px 0 4px;padding:12px 8px 6px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.sch svg{width:100%;height:auto;display:block}
.sch .cap{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 4px}
.facts{margin:14px 0 0;display:grid;gap:8px;font-size:14px}
.facts div b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.go{display:inline-block;margin-top:14px;color:var(--accent);font-weight:500;font-size:14px}
.votebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.votes{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vbtn{min-height:60px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14px "Instrument Sans",sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px}
.vbtn span{font-size:20px;line-height:1}
.vbtn[data-v=y]{border-color:var(--yes)}.vbtn[data-v=m]{border-color:var(--maybe)}.vbtn[data-v=n]{border-color:var(--no)}
.vbtn[aria-pressed=true][data-v=y]{background:var(--yes);color:var(--on)}
.vbtn[aria-pressed=true][data-v=m]{background:var(--maybe);color:var(--on)}
.vbtn[aria-pressed=true][data-v=n]{background:var(--no);color:var(--on)}
.hint{max-width:560px;margin:6px auto 0;text-align:center;font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 13px "Instrument Sans",sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:8px}
.row-i{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.row-i .th{width:64px;height:64px;border-radius:10px;background:var(--ph);flex:none;overflow:hidden}
.row-i .th img{width:100%;height:100%;object-fit:cover;display:block}
.row-i .tx{flex:1;min-width:0}
.row-i .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-i .tx small{color:var(--muted);font-size:13px}
.pill{font:600 12px "Instrument Sans",sans-serif;padding:5px 10px;border-radius:999px;color:var(--on);flex:none}
.pill.y{background:var(--yes)}.pill.m{background:var(--maybe)}.pill.n{background:var(--no)}.pill.z{background:var(--line);color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.panel h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;margin:0 0 6px}
.panel p{margin:4px 0 10px;font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:600 14px "Instrument Sans",sans-serif;padding:12px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
textarea.out{width:100%;min-height:120px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:13px/1.4 "Instrument Sans",sans-serif;padding:10px;resize:vertical}
.sync{font-size:12px;color:var(--muted);margin:6px 0}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ph)}
.sync.ok i{background:var(--yes)}.sync.warn i{background:var(--maybe)}
.gate{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 94%,transparent);display:flex;align-items:center;justify-content:center;padding:20px}
.gate .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;width:100%;max-width:420px}
.gate h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;margin:0 0 6px}
.gate p{margin:0 0 14px;color:var(--muted);font-size:14px}
.gate input{width:100%;font:16px "Instrument Sans",sans-serif;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px}
.gate .btn{width:100%;padding:14px}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.done{text-align:center;padding:36px 20px}
.done h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;margin:0 0 8px}
table.sum{width:100%;border-collapse:collapse;font-size:13px}
table.sum td,table.sum th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.sum th{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.mini{display:inline-block;margin:0 4px 3px 0;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;color:var(--on)}
.mini.y{background:var(--yes)}.mini.m{background:var(--maybe)}.mini.n{background:var(--no)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:700px){.wrap{padding:0 20px}h2.name{font-size:36px}}
.site{display:inline-block;margin:6px 0 2px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.setline{margin-top:12px}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.sgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tile .ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.tile .ph img{width:100%;height:100%;object-fit:contain;display:block}
.tile .tb{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .mk{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .nm{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:19px;line-height:1.1}
.tile .pr{font-weight:600;font-size:14px}
.tile .pr small{font-weight:400;color:var(--muted)}
.tile .who2{margin-top:2px}
.tile .tl{margin-top:auto;padding-top:6px;color:var(--accent);font-weight:600;font-size:13px;text-decoration:none}
.sgl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 -4px}
.sgh{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;margin:16px 0 8px}
.sgh small{font:500 13px "Instrument Sans",sans-serif;color:var(--muted);margin-left:6px}
.cats{display:flex;gap:4px;margin:10px 0 2px;padding:3px;background:color-mix(in srgb,var(--line) 55%,transparent);border-radius:12px}
.cats:empty{display:none}
.cat{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font:600 14px "Instrument Sans",sans-serif;color:var(--muted);cursor:pointer}
.cat[aria-pressed="true"]{background:var(--card);color:var(--ink,inherit);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cat small{font-weight:500;opacity:.7}
.scene{position:relative;width:100%;aspect-ratio:1448/1086;overflow:hidden;border-radius:14px;background:var(--ph)}
.scene img{position:absolute;display:block;height:auto}
.scene>img:first-child{left:0;top:0;width:100%}
.scene.main{position:sticky;top:calc(var(--toph,120px));z-index:5;margin-top:12px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.cbcap{font-size:13px;color:var(--muted);margin:10px 2px 4px;line-height:1.45}
.cblike{width:100%;margin:6px 0 2px;padding:14px}
.cblike.on{background:var(--yes);color:var(--on)}
.cbn{font-size:13px;color:var(--muted);margin:6px 2px 0}
.cbrow{margin-top:14px}
.cbh{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 2px 6px}
.sws{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.sw{flex:0 0 calc((100% - 24px)/5);min-width:60px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font:500 11.5px "Instrument Sans",sans-serif;color:var(--ink);text-align:center;line-height:1.2}
.sw img,.sw .dots{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--line);display:flex;overflow:hidden;box-sizing:border-box}
.sw .dots i{flex:1;display:block}
.sw[aria-pressed="true"] img,.sw[aria-pressed="true"] .dots{border:3px solid var(--accent)}
.cbnote{font-size:12px;color:var(--muted);margin:14px 2px 0}
.cbitem{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.cbitem .scene.mini{flex:0 0 46%;width:46%;border-radius:10px}
.cbtx{flex:1;min-width:0;font-size:13px}
.cbtx b{display:block;margin-bottom:6px;line-height:1.3}
.cbact{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pend{position:absolute;left:10px;top:10px;z-index:2;background:rgba(30,28,25,.72);color:#fff;font:500 12px "Instrument Sans",sans-serif;padding:5px 10px;border-radius:999px}
.parts{margin-top:4px}
.pt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
.pc{margin-bottom:10px}
.pc>b{display:block;font-size:12px;font-weight:600;color:var(--ink);margin:0 0 4px}
.pi{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:0 -8px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.3}
.pi:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pi img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:0 0 44px;border:1px solid var(--line)}
.pi span{flex:1}.pi i{font-style:normal;color:var(--muted)}
.pi em{font-style:normal;color:var(--accent);font-weight:600}
@media (min-width:1000px){
  .wrap{max-width:1440px;padding:0 28px}
  .top .wrap{max-width:1440px}
  #view .card:not(.done){display:grid;grid-template-columns:minmax(0,1fr) 420px;align-items:stretch;border-radius:22px;height:calc(100vh - var(--toph,150px) - 176px);min-height:460px}
  #view .card .photo{aspect-ratio:auto;height:100%;min-height:0}
  #view .card .in{padding:22px 24px 150px;height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .votebar{left:auto;right:max(28px,calc((100vw - 1440px)/2 + 28px));width:420px;bottom:18px;border:1px solid var(--line);border-radius:18px;padding:12px}
  .votes{max-width:none}.hint{max-width:none}
  .nav{max-width:none}
  #view .list,#view .chips,#view .panel,#view .empty{max-width:760px;margin-left:auto;margin-right:auto}
}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="row">
    <div><h1 class="brand" id="h1">Стеллаж за роялем</h1><p class="sub" id="sub">Ниша 1630 × 2500 мм, глубина до 650 мм</p></div>
    <button class="who" id="who" type="button" aria-label="Кто выбирает">—</button>
  </div>
  <div class="cats" id="cats"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
</div></div>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="votebar" id="votebar"><div class="votes" id="votes"></div><div class="hint" id="hint">Повторное нажатие снимает выбор. Можно листать свайпом.</div></div>
<div id="overlay"></div>

<script>
(function(){
  var API="https://script.google.com/macros/s/AKfycbxvyx2dNUykQD08biH0fTlAsZfYtVy61Lpaz347PkQwCBHu40dOyMfLHMHqmIfLu8GN-w/exec";
  window.ADMIN=/[?&]admin\b/.test(location.search);
  var ADMINPW=null;
  var PENDING=null;
  function askPw(){
    var saved=null;try{saved=localStorage.getItem("gs.pw")}catch(e){}
    if(saved){PENDING=saved;return Promise.resolve(saved)}
    return new Promise(function(res){
      var d=document.createElement("div");d.className="gate";
      d.innerHTML='<div class="box"><h2>Сводка</h2><p>Введите пароль.</p><input id="pwin" type="password" autocomplete="current-password"><button class="btn" id="pwok" type="button">Открыть</button></div>';
      document.body.appendChild(d);
      var i=d.querySelector("#pwin");setTimeout(function(){i.focus()},50);
      function ok(){var v=i.value;d.remove();PENDING=v;res(v)}
      d.querySelector("#pwok").addEventListener("click",ok);
      i.addEventListener("keydown",function(e){if(e.key==="Enter")ok()});
    });
  }
  function call(action,data){
    return fetch(API,{method:"POST",body:JSON.stringify({action:action,data:data}),redirect:"follow"})
      .then(function(r){return r.json()})
      .then(function(j){if(!j||j.error)throw{code:j&&j.error==="bad password"?"denied":"failed"};return j.result})
      .catch(function(e){throw e&&e.code?e:{code:"unavailable"}});
  }
  var uid;try{uid=localStorage.getItem("gs.uid")}catch(e){}
  if(!uid){uid="u"+Math.random().toString(36).slice(2,10);try{localStorage.setItem("gs.uid",uid)}catch(e){}}
  var db={
    doc:function(){return{
      get:function(){return Promise.resolve({exists:false,data:function(){return{}}})},
      set:function(d){var names={};(window.ALLITEMS||window.ITEMS||[]).forEach(function(p){names[p.id]=p.maker+" "+p.name});Object.keys(d.voters||{}).forEach(function(k){Object.keys((d.voters[k]||{}).v||{}).forEach(function(id){if(/^combo:/.test(id)&&window.comboName)names[id]=window.comboName(id)})});return call("save",{voters:d.voters||{},names:names})}
    }},
    collection:function(){return{get:function(){
      function go(){return call("all",{pw:ADMINPW}).then(function(v){return{docs:[{id:"all",data:function(){return{voters:v}}}]}})}
      if(ADMINPW)return go();
      return askPw().then(function(pw){return call("check",{pw:pw}).then(function(ok){if(!ok){try{localStorage.removeItem("gs.pw")}catch(e){};throw{code:"denied"}};try{localStorage.setItem("gs.pw",pw)}catch(e){};return ok})}).then(function(){ADMINPW=ADMINPW||PENDING;return go()});
      return call("check",{pw:""}).then(function(ok){if(!ok)throw{code:"denied"};ADMINPW=pw;return go()});
    }}}
  };
  var user={id:function(){return Promise.resolve(uid)},canEdit:function(){return Promise.resolve(window.ADMIN)},isOwner:function(){return Promise.resolve(window.ADMIN)},can:function(){return Promise.resolve(true)}};
  window.claude={use:function(n){return Promise.resolve(n==="db"?db:n==="user"?user:null)}};
})();
</script>

/* ---------- комплект и цена ---------- */

  if(p.set&&p.set.p) return sum(p.set.p);

  if(same) return n+" "+noun+" по "+w[0]+" мм = "+sum(w)+" мм";
  return n+" блока: "+w.join(" + ")+" = "+sum(w)+" мм";
}

  var sm=[];
  if(p.set&&!p.set.p){sm.push(p.set.w.length+" × "+fmt(p.price)+" €")}
  if(p.set&&p.set.p){sm.push(p.set.p.map(function(x){return fmt(x)}).join(" + ")+" €")}

  return h+'</div>';
}

/* ---------- схема ---------- */
function scheme(p){
  var parts=partsOf(p),gap=p.set?10:0,tot=sum(parts)+gap*(parts.length-1);
  var k=0.075,nw=NW*k,nh=NH*k,nd=ND*k,ox=4,oy=16,px=ox+nw+34;
  var vw=px+nw+4,over=p.h>NH,dOver=p.d&&p.d>ND;
  var col=over?"var(--rust)":"var(--accent)";
  var s='<svg viewBox="0 0 '+vw+' '+(oy+nh+30)+'" role="img" aria-label="Схема в нише: '+esc(setText(p)||(p.w+" мм"))+'">';
  s+='<text x="'+(ox+nw/2)+'" y="10" text-anchor="middle" font-size="9.5" fill="var(--muted)">Вид спереди</text>';
  s+='<rect x="'+ox+'" y="'+oy+'" width="'+nw+'" height="'+nh+'" fill="none" stroke="var(--ph)" stroke-width="1.2" stroke-dasharray="4 3"/>';
  var drawW=Math.min(tot,NW),x0=ox+(nw-drawW*k)/2,cx=0;
  var ih=Math.min(p.h,NH)*k;
  parts.forEach(function(w,i){
    var bw=Math.min(w,NW)*k,x=x0+cx*k;
    s+='<rect x="'+x.toFixed(1)+'" y="'+(oy+nh-ih).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ih.toFixed(1)+'" fill="'+col+'" fill-opacity="'+(i%2?".34":".2")+'" stroke="'+col+'" stroke-width="1.4"/>';
    if(parts.length>1&&bw>=16) s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(oy+nh-5)+'" text-anchor="middle" font-size="8.5" fill="var(--ink)">'+w+'</text>';
    cx+=w+gap;
  });
  if(p.modular||p.mount==="ceil"&&p.w>=NW){
    s+='<line x1="'+(x0+4)+'" y1="'+(oy+nh-ih)+'" x2="'+(x0+4)+'" y2="'+(oy+nh)+'" stroke="'+col+'" stroke-width="1.6"/><line x1="'+(x0+drawW*k-4)+'" y1="'+(oy+nh-ih)+'" x2="'+(x0+drawW*k-4)+'" y2="'+(oy+nh)+'" stroke="'+col+'" stroke-width="1.6"/>';
  }
  if(over) s+='<path d="M'+(ox+nw/2-5)+' '+(oy+6)+' l5 -7 l5 7" fill="none" stroke="var(--rust)" stroke-width="1.4"/>';
  var capW=p.modular?"до "+NW+" мм":(p.set?sum(parts)+" мм":p.w+" мм");
  var capH=over?p.h+" мм, выше ниши":(p.modular?"до потолка":p.h+" мм");
  s+='<text x="'+(ox+nw/2)+'" y="'+(oy+nh+13)+'" text-anchor="middle" font-size="9.5" fill="var(--ink)">'+esc(capW+" × "+capH)+'</text>';
  s+='<text x="'+(ox+nw/2)+'" y="'+(oy+nh+25)+'" text-anchor="middle" font-size="8.5" fill="var(--muted)">ниша '+NW+' × '+NH+'</text>';
  /* вид сверху */
  s+='<text x="'+(px+nw/2)+'" y="10" text-anchor="middle" font-size="9.5" fill="var(--muted)">Вид сверху</text>';
  s+='<rect x="'+px+'" y="'+oy+'" width="'+nw+'" height="'+nd+'" fill="none" stroke="var(--ph)" stroke-width="1.2" stroke-dasharray="4 3"/>';
  s+='<line x1="'+px+'" y1="'+oy+'" x2="'+(px+nw)+'" y2="'+oy+'" stroke="var(--muted)" stroke-width="2.4"/>';
  s+='<text x="'+(px+nw-3)+'" y="'+(oy-4)+'" text-anchor="end" font-size="8" fill="var(--muted)">стена</text>';
  var dd=p.d?Math.min(p.d,ND*1.25):300,pcol=dOver?"var(--rust)":"var(--accent)",cx2=0;
  parts.forEach(function(w,i){
    var bw=Math.min(w,NW)*k,x=px+(nw-drawW*k)/2+cx2*k;
    s+='<rect x="'+x.toFixed(1)+'" y="'+oy+'" width="'+bw.toFixed(1)+'" height="'+(dd*k).toFixed(1)+'" fill="'+pcol+'" fill-opacity="'+(p.d?(i%2?".4":".28"):".08")+'" stroke="'+pcol+'" stroke-width="1.4"'+(p.d?'':' stroke-dasharray="3 2"')+'/>';
    cx2+=w+gap;
  });
  s+='<text x="'+(px+nw/2)+'" y="'+(oy+nd+13)+'" text-anchor="middle" font-size="9.5" fill="'+(dOver?"var(--rust)":"var(--ink)")+'">'+(p.d?"глубина "+p.d+" мм":"глубина по составу")+'</text>';
  s+='<text x="'+(px+nw/2)+'" y="'+(oy+nd+25)+'" text-anchor="middle" font-size="8.5" fill="var(--muted)">в нише до '+ND+' мм</text>';
  return s+'</svg>';
}

function me(){return S.store[S.slug]}
function getVote(id){var m=me();return m&&m.v?m.v[id]||"":""}
function persist(){lsSet("gs.store.v1",S.store);lsSet("gs.slug.v1",S.slug)}
function setVote(id,val){
  var m=me();if(!m)return;
  if(m.v[id]===val) delete m.v[id]; else m.v[id]=val;
  m.t=Date.now();persist();schedSync();
}
var syncTimer=null,syncBusy=false,dirty=false;
function setSync(s){S.sync=s;var el=$("syncline");if(el)drawSync(el)}
function drawSync(el){
  var t={ok:["ok","Ответы сохранены и видны Алексу"],saving:["warn","Сохраняю…"],local:["warn","Ответы пока только на этом устройстве. Нажмите «Скопировать ответы» и отправьте Алексу."]}[S.sync]||["warn",""];
  el.className="sync "+t[0];el.innerHTML="<i></i>"+esc(t[1]);
}
function schedSync(){dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(pushSync,900)}
function pushSync(){
  if(!S.db||!S.uid||S.canWrite===false){setSync("local");return}
  if(syncBusy){schedSync();return}
  syncBusy=true;dirty=false;setSync("saving");
  var tries=0;
  (function go(){
    S.db.doc("votes/"+S.uid).set({voters:S.store,updated:Date.now()}).then(function(){
      syncBusy=false;setSync("ok");if(dirty)schedSync();
    },function(e){
      if(e&&e.code==="unavailable"&&tries++<1){setTimeout(go,900+Math.random()*600);return}
      syncBusy=false;if(!e||e.code!=="resource_exhausted")S.canWrite=false;setSync("local");
    });
  })();
}
function mergeRemote(rem){
  var ch=false;
  Object.keys(rem||{}).forEach(function(k){var r=rem[k],l=S.store[k];if(r&&r.v&&(!l||(r.t||0)>(l.t||0))){S.store[k]=r;ch=true}});
  return ch;
}

  var l=ids.map(function(id){return ITEMS.filter(function(p){return p.id===id})[0]}).filter(Boolean);
  out+=l.length?'<div class="sgrid">'+l.map(function(p){return tileHtml(p,sel?null:by[st][p.id],st)}).join("")+'</div>':'<div class="empty">'+(sel?esc(sel.name)+': здесь пусто':'Здесь пока пусто')+'</div>';
  if(sel){var z=ITEMS.filter(function(p){return !sel.v[p.id]}).length;if(z)out+='<p style="color:var(--muted);font-size:13px;margin-top:14px">Без ответа: '+z+'</p>'}

function pickName(name){
  name=String(name||"").trim().replace(/\s+/g," ").slice(0,40);

  var k=slugOf(name);
  if(!S.store[k])S.store[k]={name:name,v:{},t:Date.now()};
  S.slug=k;persist();$("overlay").innerHTML="";S.idx=0;

document.addEventListener("click",function(e){
  var t=e.target;
  var b=t.closest&&t.closest("button,.photo img,.tile .ph img");if(!b)return;
  if(b.dataset.cat){setCat(b.dataset.cat);if(S.tab==="view"&&S.idx>ITEMS.length)S.idx=firstOpen();render();window.scrollTo(0,0);return}
  if(b.dataset.cbw||b.dataset.cbc||b.dataset.cbt){var s=cbSel();if(b.dataset.cbw)s.w=b.dataset.cbw;if(b.dataset.cbc)s.c=b.dataset.cbc;if(b.dataset.cbt)s.t=b.dataset.cbt;lsSet("gs.cb.v1",s);var y=window.scrollY;renderCombo();window.scrollTo(0,y);return}
  if(b.id==="cblike"){var id=cbId();setVote(id,"y");var y2=window.scrollY;renderCombo();window.scrollTo(0,y2);return}
  if(b.dataset.cbgo){var q=/^combo:(w\d)(c\d)(t\d)$/.exec(b.dataset.cbgo);S.cb={w:q[1],c:q[2],t:q[3]};lsSet("gs.cb.v1",S.cb);S.tab="view";render();window.scrollTo(0,0);return}
  if(b.dataset.cbdel){setVote(b.dataset.cbdel,"y");renderComboMine();return}
  if(b.matches(".tab")){S.tab=b.dataset.t;render();window.scrollTo(0,0);return}
  if(b.id==="who"){openGate();return}
  if(b.id==="start"){pickName($("nm").value);return}
  if(b.dataset.n){pickName(b.dataset.n);return}
  if(b.id==="prev"){go(-1);return}
  if(b.id==="next"){go(1);return}
  if(b.id==="gomine"){S.tab="mine";render();return}
  if(b.dataset.v&&b.closest("#votes")){
    var p=ITEMS[S.idx],before=getVote(p.id);setVote(p.id,b.dataset.v);
    var after=getVote(p.id);renderView();
    if(after&&after!==before){var at=S.idx;setTimeout(function(){if(S.idx===at&&S.tab==="view")go(1)},420)}
    return}
  if(b.dataset.go){S.idx=+b.dataset.go;S.tab="view";render();return}
  if(b.dataset.f){S.filter=b.dataset.f;renderMine();return}
  if(b.dataset.st){S.sumTab=b.dataset.st;drawSum();return}
  if(b.dataset.vt!==undefined&&b.closest("#vtabs")){S.sumVoter=b.dataset.vt||null;drawSum();return}
  if(b.id==="refresh"){$("sumst").textContent="Загружаю…";loadSum();return}

    var txt=summaryText(),ta=$("out");
    function sel(){ta.focus();ta.select();$("copy").textContent="Выделено, нажмите «Копировать»"}
    try{navigator.clipboard.writeText(txt).then(function(){$("copy").textContent="Скопировано"},sel)}catch(x){sel()}
    return}
  if(b.dataset.zoom){
    $("overlay").innerHTML='<div class="zoom" id="zoom"><img src="'+esc(b.dataset.zoom)+'" alt=""></div>';return}
});

  var want=qc&&catOf(qc).key===qc?qc:(lc||"shelf");
  if(!catOf(want).items.length&&!catOf(want).custom&&!window.ADMIN)want="shelf";
  setCat(want);S.pos={};
  if(sl&&S.store[sl]){S.slug=sl;S.idx=firstOpen();render()}
  else{render();openGate()}
  if(typeof claude==="undefined"||!claude.use)return;
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db)return;
    S.db=db;
    var pu=user&&user.id?user.id():Promise.resolve(null);
    var pe=user&&user.canEdit?user.canEdit():Promise.resolve(false);
    var pw=user&&user.can?user.can("data.write"):Promise.resolve(null);
    return Promise.all([pu,pe,pw]).then(function(x){
      S.uid=x[0];S.admin=!!x[1];S.canWrite=x[2]===false?false:null;
      if(S.admin){if(!S.slug){S.tab="sum";$("overlay").innerHTML=""}render()}
      if(!S.uid){S.canWrite=false;return}
      var done=false,to=setTimeout(function(){done=true},10000);
      return db.doc("votes/"+S.uid).get().then(function(snap){
        clearTimeout(to);if(done)return;
        var rem=snap.exists?((snap.data()||{}).voters||{}):{};
        var ch=mergeRemote(rem);
        if(ch){persist();if(!S.slug||!S.store[S.slug]){}else{ if(S.tab==="view"&&S.idx>=0)render()}}
        if(JSON.stringify(rem)!==JSON.stringify(S.store)&&Object.keys(S.store).length)schedSync();
        else setSync(S.canWrite===false?"local":"ok");
      },function(){clearTimeout(to)});
    });
  }).catch(function(){});
})();
</script>
